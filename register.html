<!DOCTYPE html>  
<html lang="en">  
<head>  
  <meta charset="UTF-8" />  
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />  
  <title>Register - ChiboyDatabase</title>  
  <style>  
    body {  
      font-family: "Poppins", sans-serif;  
      color: #fff;  
      display: flex;  
      justify-content: center;  
      align-items: center;  
      height: 100vh;  
      margin: 0;  
      background: url('https://drive.google.com/thumbnail?id=1kUAwWIpyNAsIjEZ7TJ-ROXVqEpZsJCtv&sz=s800')   
        center center / cover no-repeat fixed;  
      backdrop-filter: blur(6px);  
    }  

    .register-container {  
      background: rgba(0, 0, 0, 0.6);  
      padding: 2rem;  
      border-radius: 15px;  
      box-shadow: 0 0 20px rgba(229, 9, 20, 0.4);  
      width: 90%;  
      max-width: 400px;  
      animation: fadeInUp 1s ease;  
      backdrop-filter: blur(8px);  
    }  

    h2 {  
      text-align: center;  
      color: #e50914;  
      margin-bottom: 1rem;  
    }  

    form {  
      display: flex;  
      flex-direction: column;  
    }  

    label {  
      font-size: 0.9rem;  
      margin-bottom: 0.3rem;  
    }  

    input {  
      padding: 0.8rem;  
      margin-bottom: 1.2rem;  
      border: none;  
      border-radius: 8px;  
      background: rgba(255, 255, 255, 0.1);  
      color: #fff;  
      outline: none;  
      transition: all 0.3s ease;  
    }  

    input:focus {  
      box-shadow: 0 0 5px #e50914;  
      background: rgba(255, 255, 255, 0.15);  
    }  

    button {  
      background: #e50914;  
      color: #fff;  
      padding: 0.9rem;  
      border: none;  
      border-radius: 10px;  
      font-weight: bold;  
      cursor: pointer;  
      transition: background 0.3s ease;  
    }  

    button:hover {  
      background: #b20610;  
    }  

    .back-home {  
      display: block;  
      text-align: center;  
      margin-top: 1rem;  
      color: #ccc;  
      text-decoration: none;  
      font-size: 0.9rem;  
      transition: color 0.3s;  
    }  

    .back-home:hover {  
      color: #e50914;  
    }  

    @keyframes fadeInUp {  
      from { opacity: 0; transform: translateY(40px); }  
      to { opacity: 1; transform: translateY(0); }  
    }  
  </style>  
</head>  
<body>  
  <div class="register-container">  
    <h2>Pre-register and claim your reward</h2>  
    <form id="registerForm">  
      <label for="fullname">Full Name</label>  
      <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>  

      <label for="email">Email Address</label>  
      <input type="email" id="email" name="email" placeholder="Enter your email" required>  

      <label for="phone">Phone Number</label>  
      <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" pattern="[0-9]{11,}" title="Phone number must contain at least 11 digits" required>  

      <label for="password">Password</label>  
      <input type="password" id="password" name="password" placeholder="Create password" required>  

      <button type="submit">Register</button>  
    </form>  
    <a href="chiboydatabase.html" class="back-home">← Back to Home</a>  
  </div>  

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
  <script>  
    const supabaseUrl = "https://numlqdnbilqfgtijydqx.supabase.co";  
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im51bWxxZG5iaWxxZmd0aWp5ZHF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE4NTM3NzEsImV4cCI6MjA3NzQyOTc3MX0.ekmOHFl6PGAhIGmOvVX8efggmLv-74ugwFJWSpdo7YM";  
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);  

    const form = document.getElementById("registerForm");  

    form.addEventListener("submit", async (e) => {  
      e.preventDefault();  

      const fullname = document.getElementById("fullname").value.trim();  
      const email = document.getElementById("email").value.trim();  
      const phone = document.getElementById("phone").value.trim();  
      const password = document.getElementById("password").value.trim();  

      // Generate unique registration ID  
      const registrationId = "£" + Math.random().toString(36).substring(2, 7).toUpperCase() + Math.floor(Math.random() * 9000 + 1000);  

      // Save to Supabase  
      const { data, error } = await supabaseClient  
        .from("chiboy_users")  
        .insert([{ fullname, email, phone, password, registration_id: registrationId }]);  

      if (error) {  
        alert("❌ Registration failed: " + error.message);  
      } else {  
        form.reset();  
        showSuccessPopup(registrationId);  
      }  
    });  

    function showSuccessPopup(regId) {  
      const popup = document.createElement("div");  
      popup.innerHTML = `  
        <div style="  
          position: fixed; top: 0; left: 0; width: 100%; height: 100%;  
          background: rgba(0,0,0,0.7); display: flex; justify-content: center;  
          align-items: center; z-index: 1000;  
        ">  
          <div style="  
            background: #fff; color: #000; border-radius: 15px;  
            padding: 25px; width: 90%; max-width: 400px; text-align: center;  
            animation: fadeIn 0.5s ease;  
          ">  
            <h3>🎉 Congratulations!</h3>  
            <p>You have successfully joined <b>ChiboyDatabase</b>.</p>  
            <p>Your registration ID is  
              <span id="regId" style="font-weight:bold;color:#e50914;cursor:pointer;border:1px solid #e50914;padding:5px 10px;border-radius:8px;">  
                ${regId}  
              </span>  
            </p>  
            <p>How would you like to verify your account and start?</p>  

            <div style="display:flex;justify-content:center;gap:20px;margin-top:15px;">  
              <a href="https://t.me/chiboydatabase" target="_blank">  
                <img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" width="35">  
              </a>  
              <a href="https://facebook.com/yourfacebookusername" target="_blank">  
                <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" width="35">  
              </a>  
              <a href="https://wa.me/2347064173933?text=Hello%20ChiboyDatabase,%20I%20would%20like%20to%20activate%20my%20account%20with%20the%20ID-%20${encodeURIComponent(regId)}" target="_blank">  
                <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" width="35">  
              </a>  
            </div>  
          </div>  
        </div>  
        <style>  
          @keyframes fadeIn { from {opacity:0} to {opacity:1} }  
        </style>  
      `;  

      document.body.appendChild(popup);  

      // Copy registration ID  
      document.getElementById("regId").addEventListener("click", () => {  
        navigator.clipboard.writeText(regId);  
        alert("✅ Registration ID copied!");  
      });  
    }  
  </script>  
</body>  
</html>
